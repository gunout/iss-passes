name: Update ISS TLE

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch TLE from Celestrak
        run: |
          curl -s "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE" -o tle.txt
          L1=$(sed -n '2p' tle.txt)
          L2=$(sed -n '3p' tle.txt)
          if [ -z "$L1" ] || [ -z "$L2" ]; then echo "TLE vide"; exit 1; fi
          jq -n --arg l1 "$L1" --arg l2 "$L2" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{line1:$l1, line2:$l2, updatedAt:$ts}' > data/tle.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/tle.json
          git diff --cached --quiet || git commit -m "chore: update ISS TLE [skip ci]"
          git push
